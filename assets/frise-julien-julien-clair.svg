<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" fill="none" role="img" aria-labelledby="title desc" lang="fr" xml:lang="fr">
  <title id="title">Julien Julien — Explorer, construire, transmettre</title>
  <desc id="desc">1991 : à trois ans, je découvre l’informatique sur un Macintosh LC. En 1997, je crée mes premiers sites web. Aujourd’hui, je mêle développement, narration et IA pour créer des expériences numériques. Toujours la curiosité des premiers clics.</desc>
  <defs>
    <linearGradient id="thread" x1="92" y1="222" x2="1108" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00978d" stop-opacity=".2"/>
      <stop offset=".12" stop-color="#00978d"/>
      <stop offset=".88" stop-color="#007f77"/>
      <stop offset="1" stop-color="#007f77" stop-opacity=".2"/>
    </linearGradient>
    <pattern id="pixels" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#08766d" opacity=".12"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="468" rx="18" fill="#ffffff" stroke="#d5dfdf"/>

  <!-- Quiet editorial label: the three milestones carry the visual hierarchy. -->
  <g fill="#647780" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.7">
    <text x="36" y="37">JULIEN JULIEN / PARCOURS NUMÉRIQUE</text>
    <text x="1164" y="37" text-anchor="end">DEPUIS 1991</text>
  </g>

  <!-- Macintosh LC, redrawn from the supplied photos: squat CRT resting directly
       on the pizza-box case, right-hand floppy slot, extended keyboard and ADB mouse. -->
  <g transform="translate(110 62)" stroke-linejoin="round">
    <!-- Monitor bezel and curved 4:3 screen; no tall monitor stand. -->
    <path d="M38 4Q100 1 162 4L164 104Q100 108 36 104Z" fill="#c2c1af" stroke="#92958c" stroke-width="1.5"/>
    <path d="M39 5Q100 2 161 5L158 10Q100 7 43 10L41 99L37 103Z" fill="#e5e4d6"/>
    <path d="M50 17Q100 13 151 17L152 87Q100 91 49 87Z" fill="#92958c"/>
    <path d="M54 21Q101 17 147 21V83Q101 87 53 83Z" fill="#303c35"/>
    <path d="M56 24Q101 20 145 24V81Q101 85 55 81Z" fill="#d7efea"/>
    <path d="M56 24Q101 20 145 24V81Q101 85 55 81Z" fill="url(#pixels)"/>
    <g transform="translate(22 10)" fill="#08766d" shape-rendering="crispEdges">
      <path d="M66 31H90V34H94V54H90V58H66V54H62V35H66ZM68 37V42H72V37ZM84 37V42H88V37ZM69 49V52H72V55H84V52H87V49H84V52H72V49Z" fill-rule="evenodd"/>
      <path d="M107 55V67L110 64L113 70L116 68L113 62H119Z"/>
    </g>
    <path d="M49 98H53" stroke="#535a51" stroke-width="1.5"/>
    <path d="M43 106H157" stroke="#535a51" stroke-width="2"/>
    <!-- Low-profile Macintosh LC case, front seam and floppy drive. -->
    <path d="M36 109H164L166 114V128Q100 131 34 128V114Z" fill="#c2c1af" stroke="#92958c" stroke-width="1.5"/>
    <path d="M37 110H163L164 114H35Z" fill="#e5e4d6"/>
    <path d="M35 119H165" stroke="#92958c" stroke-width="1"/>
    <path d="M46 114H87V118H46Z" stroke="#92958c" stroke-width=".8"/>
    <path d="M116 114H156V117H116Z" fill="#313b33"/>
    <path d="M117 117H155" stroke="#e5e4d6" stroke-width=".7"/>
    <circle cx="159" cy="115.5" r=".65" fill="#535a51"/>
    <path d="M43 130H157V133H43Z" fill="#92958c"/>
    <!-- Small rainbow Apple mark and model name, as on the LC front panel. -->
    <g transform="translate(42 120) scale(.55)">
      <defs><clipPath id="lc-apple"><path d="M7 3C6 1 8 0 10 0C10 2 9 3 7 3ZM7 4C3 1 0 4 1 8C2 13 5 15 7 13C10 15 12 11 13 9C9 8 9 5 12 4C10 2 9 3 7 4Z"/></clipPath></defs>
      <g clip-path="url(#lc-apple)">
        <path d="M0 0H14V4H0Z" fill="#67ad43"/><path d="M0 4H14V6H0Z" fill="#f3d343"/>
        <path d="M0 6H14V8H0Z" fill="#ed9c39"/><path d="M0 8H14V10H0Z" fill="#d9574c"/>
        <path d="M0 10H14V12H0Z" fill="#a5659c"/><path d="M0 12H14V15H0Z" fill="#5196bf"/>
      </g>
    </g>
    <text x="53" y="127" fill="#465047" font-family="Georgia, 'Times New Roman', serif" font-size="5.5">Macintosh LC</text>
    <!-- Keyboard and mouse cables, behind the peripherals. -->
    <path d="M36 121C22 121 30 132 20 136M164 121C184 121 171 137 195 135" stroke="#92958c" stroke-width="2" fill="none"/>
    <!-- Extended keyboard: main key block, arrow cluster and numeric keypad. -->
    <path d="M10 136H165L177 155V158H0V155Z" fill="#c2c1af" stroke="#92958c" stroke-width="1.5"/>
    <path d="M10 137H165L167 140H9Z" fill="#e5e4d6"/>
    <path d="M1 155H176" stroke="#92958c"/>
    <g fill="#e5e4d6" stroke="#92958c" stroke-width=".65">
      <rect x="14" y="140" width="7.4" height="3" rx=".45"/><rect x="23" y="140" width="7.4" height="3" rx=".45"/><rect x="32" y="140" width="7.4" height="3" rx=".45"/><rect x="41" y="140" width="7.4" height="3" rx=".45"/><rect x="50" y="140" width="7.4" height="3" rx=".45"/><rect x="59" y="140" width="7.4" height="3" rx=".45"/><rect x="68" y="140" width="7.4" height="3" rx=".45"/><rect x="77" y="140" width="7.4" height="3" rx=".45"/><rect x="86" y="140" width="7.4" height="3" rx=".45"/><rect x="95" y="140" width="7.4" height="3" rx=".45"/><rect x="104" y="140" width="7.4" height="3" rx=".45"/><rect x="113" y="140" width="7.4" height="3" rx=".45"/><rect x="12" y="144" width="7.4" height="3" rx=".45"/><rect x="21" y="144" width="7.4" height="3" rx=".45"/><rect x="30" y="144" width="7.4" height="3" rx=".45"/><rect x="39" y="144" width="7.4" height="3" rx=".45"/><rect x="48" y="144" width="7.4" height="3" rx=".45"/><rect x="57" y="144" width="7.4" height="3" rx=".45"/><rect x="66" y="144" width="7.4" height="3" rx=".45"/><rect x="75" y="144" width="7.4" height="3" rx=".45"/><rect x="84" y="144" width="7.4" height="3" rx=".45"/><rect x="93" y="144" width="7.4" height="3" rx=".45"/><rect x="102" y="144" width="7.4" height="3" rx=".45"/><rect x="111" y="144" width="7.4" height="3" rx=".45"/><rect x="10" y="148" width="7.4" height="3" rx=".45"/><rect x="19" y="148" width="7.4" height="3" rx=".45"/><rect x="28" y="148" width="7.4" height="3" rx=".45"/><rect x="37" y="148" width="7.4" height="3" rx=".45"/><rect x="46" y="148" width="7.4" height="3" rx=".45"/><rect x="55" y="148" width="7.4" height="3" rx=".45"/><rect x="64" y="148" width="7.4" height="3" rx=".45"/><rect x="73" y="148" width="7.4" height="3" rx=".45"/><rect x="82" y="148" width="7.4" height="3" rx=".45"/><rect x="91" y="148" width="7.4" height="3" rx=".45"/><rect x="100" y="148" width="7.4" height="3" rx=".45"/><rect x="109" y="148" width="7.4" height="3" rx=".45"/>
      <rect x="12" y="152" width="12" height="2.5" rx=".4"/><rect x="26" y="152" width="12" height="2.5" rx=".4"/>
      <rect x="40" y="152" width="49" height="2.5" rx=".4"/><rect x="91" y="152" width="12" height="2.5" rx=".4"/>
      <rect x="105" y="152" width="12" height="2.5" rx=".4"/>
      <rect x="130" y="140" width="6.5" height="3" rx=".45"/><rect x="138" y="140" width="6.5" height="3" rx=".45"/><rect x="146" y="140" width="6.5" height="3" rx=".45"/><rect x="154" y="140" width="6.5" height="3" rx=".45"/><rect x="130" y="144" width="6.5" height="3" rx=".45"/><rect x="138" y="144" width="6.5" height="3" rx=".45"/><rect x="146" y="144" width="6.5" height="3" rx=".45"/><rect x="154" y="144" width="6.5" height="3" rx=".45"/><rect x="130" y="148" width="6.5" height="3" rx=".45"/><rect x="138" y="148" width="6.5" height="3" rx=".45"/><rect x="146" y="148" width="6.5" height="3" rx=".45"/><rect x="154" y="148" width="6.5" height="3" rx=".45"/>
      <rect x="130" y="152" width="14.5" height="2.5" rx=".4"/><rect x="146" y="152" width="6.5" height="2.5" rx=".4"/>
      <rect x="154" y="152" width="6.5" height="2.5" rx=".4"/>
    </g>
    <!-- Squared one-button ADB mouse, with a single transverse button seam. -->
    <path d="M190 137Q196 135 202 138L209 153Q209 157 205 158H191Q188 157 188 153V141Q188 138 190 137Z" fill="#c2c1af" stroke="#92958c" stroke-width="1.5"/>
    <path d="M191 138Q196 137 201 139L204 145H190Z" fill="#e5e4d6" stroke="#92958c" stroke-width=".7"/>
  </g>

  <!-- 1997 browser: monochrome title bar, URL field and a first personal page. -->
  <g transform="translate(510 82)" stroke="#647780" stroke-width="2" stroke-linejoin="round">
    <rect x="1" y="1" width="178" height="118" rx="3" fill="#edf3f4"/>
    <path d="M2 21H178"/>
    <rect x="9" y="8" width="7" height="7" fill="#ffffff"/>
    <path d="M24 8H73M24 12H73M24 16H73M108 8H170M108 12H170M108 16H170" stroke="#647780" stroke-width="1" opacity=".6"/>
    <text x="90" y="15" fill="#50636c" stroke="none" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="middle">www</text>
    <path d="M14 31L9 36L14 41M9 36H22M31 31L36 36L31 41" stroke="#50636c"/>
    <rect x="47" y="28" width="123" height="17" rx="1" fill="#ffffff" stroke="#d5dfdf"/>
    <text x="54" y="40" fill="#50636c" stroke="none" font-family="Menlo, Consolas, monospace" font-size="10">http://chez-moi/</text>
    <path d="M2 52H178" stroke="#d5dfdf"/>
    <rect x="12" y="65" width="35" height="35" fill="#d7efea" stroke="#00978d"/>
    <g stroke="#08766d" stroke-width="1.5">
      <circle cx="29.5" cy="82.5" r="12"/>
      <ellipse cx="29.5" cy="82.5" rx="5" ry="12"/>
      <path d="M18 82.5H41M20 76H39M20 89H39"/>
    </g>
    <path d="M60 69H143" stroke="#007f77" stroke-width="4"/>
    <path d="M60 81H163M60 89H153M60 97H123" stroke="#647780" stroke-width="2"/>
    <rect x="130" y="105" width="39" height="8" fill="#ffffff" stroke="#d5dfdf" stroke-width="1"/>
    <text x="149.5" y="111" fill="#007f77" stroke="none" font-family="Menlo, Consolas, monospace" font-size="6.5" text-anchor="middle">000001</text>
  </g>

  <!-- Today: code, connections and a spark, all drawn locally as vector paths. -->
  <g transform="translate(912 77)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 7L137 41V109L78 143L19 109V41Z" fill="#edf3f4" stroke="#d5dfdf" stroke-width="1.5"/>
    <path d="M78 24V127M34 50L122 101M34 101L122 50" stroke="#d5dfdf" stroke-width="1"/>
    <path d="M78 24L122 50V101L78 127L34 101V50Z" stroke="#00978d" stroke-opacity=".4" stroke-width="1.5"/>
    <path d="M58 59L43 75L58 91M98 59L113 75L98 91M86 54L70 96" stroke="#007f77" stroke-width="4"/>
    <g fill="#007f77">
      <circle cx="78" cy="24" r="3"/><circle cx="34" cy="101" r="3"/><circle cx="122" cy="101" r="3"/>
    </g>
    <path d="M126 14L130 26L142 30L130 34L126 46L122 34L110 30L122 26Z" fill="#007f77" stroke="#ffffff" stroke-width="3"/>
    <path d="M146 55L148 61L154 63L148 65L146 71L144 65L138 63L144 61Z" fill="#007f77" opacity=".6"/>
  </g>

  <!-- A single turquoise thread connects all three eras. -->
  <path d="M92 235H1108" stroke="url(#thread)" stroke-width="2"/>
  <g fill="#ffffff" stroke="#007f77" stroke-width="2">
    <circle cx="210" cy="235" r="7"/>
    <circle cx="600" cy="235" r="7"/>
    <circle cx="990" cy="235" r="7"/>
  </g>
  <g fill="#007f77">
    <circle cx="210" cy="235" r="2.5"/>
    <circle cx="600" cy="235" r="2.5"/>
    <circle cx="990" cy="235" r="2.5"/>
  </g>
  <path d="M1102 231L1108 235L1102 239" stroke="#007f77" stroke-opacity=".5" stroke-width="1.5"/>

  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g fill="#1f3039" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="32" font-weight="700" letter-spacing="-1">
      <text x="210" y="284">1991</text>
      <text x="600" y="284">1997</text>
      <text x="990" y="284" font-size="29">Aujourd’hui</text>
    </g>
    <g fill="#007f77" font-size="23" font-weight="600">
      <text x="210" y="319">Explorer</text>
      <text x="600" y="319">Construire</text>
      <text x="990" y="319">Transmettre</text>
    </g>
    <g fill="#50636c" font-size="18">
      <text x="210" y="355"><tspan x="210">Trois ans, un Macintosh LC.</tspan><tspan x="210" dy="26">Tout un monde à découvrir.</tspan></text>
      <text x="600" y="355"><tspan x="600">Mes premiers sites web.</tspan><tspan x="600" dy="26">Je façonne ce monde à mon tour.</tspan></text>
      <text x="990" y="355"><tspan x="990">Développement, narration et IA.</tspan><tspan x="990" dy="26">Créer des expériences numériques.</tspan></text>
    </g>
    <path d="M480 414H720" stroke="#d5dfdf"/>
    <text x="600" y="443" fill="#647780" font-size="15" letter-spacing=".2">Toujours la curiosité des premiers clics.</text>
  </g>
</svg>
